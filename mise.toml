[vars]
rust_version = "1.97.0"
# Nightly toolchain used only by the fuzzing jobs; same pin as the workspace's
# mise/shared.toml and Xila core.
nightly_version = "nightly-2026-10-12"

[tools]
# Keep the compiler aligned with Xila core. Native mise integration makes Cargo
# commands use mr-boxington without a global shell setup or a second wrapper.
rust = { version = "{{ vars.rust_version }}", profile = "minimal", components = ["clippy", "rustfmt", "llvm-tools-preview"], mr_boxington = true }
mr-boxington = "1.12.0"
"cargo:cargo-llvm-cov" = "0.9.1"

[tasks."format"]
description = "Format every Rust crate in the workspace"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."check"]
description = "Check all workspace crates and targets"
run = "cargo check --workspace --all-targets --all-features --locked"

[tasks."clippy"]
description = "Lint all workspace crates and targets"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."test"]
description = "Run all workspace tests"
run = "cargo test --workspace --all-features --locked"

[tasks."build"]
description = "Build the workspace"
run = "cargo build --workspace --all-features --locked"

[tasks."build:linux-arm64"]
description = "Build the native Linux aarch64 xila-package executable in release mode"
run = "cargo build --locked --release --target aarch64-unknown-linux-gnu --package xila-package-builder"

[tasks."coverage"]
description = "Run Rust workspace tests with LLVM coverage instrumentation"
run = "cargo llvm-cov --workspace --all-features"

[tasks."coverage:lcov"]
description = "Generate an LCOV report for Codecov"
run = "cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info"

[tasks."doc:check"]
description = "Build Rustdoc for all workspace crates and treat warnings as errors"
run = "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked"

[tasks."ci:toolchain"]
description = "Install and report the mise-pinned Rust toolchain for shared CI setup"
run = '''
set -eu
rustc --version
if [ -n "${GITHUB_OUTPUT:-}" ]; then
  echo "version={{ vars.rust_version }}" >> "$GITHUB_OUTPUT"
fi
'''

[tasks."release:package"]
description = "Build and verify crates.io archives locally without uploading them"
run = "cargo package --workspace --locked"

[tasks."fuzz:setup"]
description = "Install the pinned nightly toolchain (with rust-src) and the pinned cargo-fuzz used only by the fuzzing jobs"
run = '''
set -eu
rustup toolchain install {{ vars.nightly_version }} --profile minimal --component rust-src
cargo install cargo-fuzz --version 0.13.2 --locked
'''

[tasks."fuzz:run"]
description = "Run fuzz targets for FUZZ_SECONDS seconds each (default 120) with FUZZ_JOBS parallel workers (default 4); FUZZ_TARGET runs a single target"
run = '''
set -eu
cd fuzz
seconds=${FUZZ_SECONDS:-120}
jobs=${FUZZ_JOBS:-4}
corpus=${FUZZ_CORPUS:-corpus}
# Create a corpus directory per target and seed each from the repository
# fixtures; make_seeds then adds the generated packages and the signed
# trust-chain document.
for target_file in fuzz_targets/*.rs; do
  target=$(basename "$target_file" .rs)
  if [ -n "${FUZZ_TARGET:-}" ] && [ "$FUZZ_TARGET" != "$target" ]; then
    continue
  fi
  mkdir -p "$corpus/$target"
  cp ../tests/fixtures/*.json "$corpus/$target/"
  cp ../crates/builder/tests/fixtures/*.json "$corpus/$target/"
done
cargo run --release --example make_seeds -- "$corpus"
# cargo-fuzz invokes plain `cargo` and `rustc` for the instrumented build, so
# put the pinned nightly toolchain first on PATH: the mise-pinned cargo is
# stable and rejects the -Z sanitizer flags.
nightly_bin="$(dirname "$(rustup which --toolchain {{ vars.nightly_version }} cargo)")"
export PATH="$nightly_bin:$PATH"
for target_file in fuzz_targets/*.rs; do
  target=$(basename "$target_file" .rs)
  if [ -n "${FUZZ_TARGET:-}" ] && [ "$FUZZ_TARGET" != "$target" ]; then
    continue
  fi
  echo "== fuzzing $target for ${seconds}s"
  cargo fuzz run "$target" "$corpus/$target" -- -max_total_time="$seconds" -jobs="$jobs" -workers="$jobs" -timeout=25 -rss_limit_mb=2560 -max_len=1048576 -print_final_stats=1
done
'''
