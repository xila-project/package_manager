[package]
publish = false
name = "xila-package-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
xila-package-manifest = { path = "../manifest" }
xila-package-bundle = { path = "../bundle" }
xila-package-verification = { path = "../verification", default-features = false, features = ["sha256", "ed25519"] }
# Temporary pinned commit from upstream PR #73; switch to crates.io after merge.
tar-no-std = { git = "https://github.com/AlixANNERAUD/tar-no-std", rev = "ecdd39990ae4143d36b7f2adcf3eff2f971fea11", default-features = false }

[dev-dependencies]
xila-package-writer = { path = "../writer" }
ed25519-dalek = { version = "3.0", default-features = false }
