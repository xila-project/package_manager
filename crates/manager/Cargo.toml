[package]
name = "xila-package-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Trusted package and registry verification and installation planning for Xila"

[lib]
name = "xila_package_manager"

[features]
default = ["planner"]
# Bounded dependency planner over registry entries.
planner = []

[dependencies]
xila-package-manifest = { version = "0.5.0", path = "../manifest" }
xila-package-verification = { version = "0.1.0", path = "../verification", default-features = false, features = ["sha256", "ed25519"] }

[dev-dependencies]
ed25519-dalek = { version = "3.0", default-features = false }
