[package]
name = "package_builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xila-package"
path = "src/main.rs"

[dependencies]
package_manifest = { path = "../package_manifest" }
package_writer = { path = "../package_writer" }
package_reader = { path = "../package_reader" }
verification = { path = "../verification", default-features = false, features = ["sha256"] }

[dev-dependencies]
tempfile = "3"
