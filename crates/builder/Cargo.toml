[package]
name = "xila-package-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build, sign and inspect Xila application packages"

[[bin]]
name = "xila-package"
path = "src/main.rs"

[dependencies]
# Latest published getargs-derive release (0.1.0); pin exactly for reproducible CI.
# Same no_std getargs/getargs-derive family as the Xila command-line Shell.
# from_args borrows its inputs, so the native binary does not need the std feature.
getargs-derive = { version = "=0.1.0", default-features = false }
getargs = { version = "0.5", default-features = false }
xila-package-manifest = { version = "0.4.0", path = "../manifest" }
xila-package-manager = { version = "0.4.0", path = "../manager" }
xila-package-bundle = { version = "0.4.0", path = "../bundle" }
xila-package-writer = { version = "0.4.0", path = "../writer" }
xila-package-reader = { version = "0.4.0", path = "../reader" }
xila-package-verification = { version = "0.1.0", path = "../verification", default-features = false, features = ["sha256", "ed25519"] }
ed25519-dalek = { version = "3.0", default-features = false }
# Operating-system CSPRNG for `key generate`; already in the lock graph via tempfile.
getrandom = "0.4"
# Whole-archive digests for registry entries; already in the lock graph.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
