[package]
publish = false
name = "xila-package-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xila-package"
path = "src/main.rs"

[dependencies]
# Latest published getargs-derive release (0.1.0); pin exactly for reproducible CI.
# Same no_std getargs/getargs-derive family as the Xila command-line Shell.
# from_args borrows its inputs, so the native binary does not need the std feature.
getargs-derive = { version = "=0.1.0", default-features = false }
getargs = { version = "0.5", default-features = false }
xila-package-manifest = { path = "../manifest" }
xila-package-bundle = { path = "../bundle" }
xila-package-writer = { path = "../writer" }
xila-package-reader = { path = "../reader" }
xila-package-verification = { path = "../verification", default-features = false, features = ["sha256", "ed25519"] }
ed25519-dalek = { version = "3.0", default-features = false }

[dev-dependencies]
tempfile = "3"
