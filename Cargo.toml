[workspace]
members = ["crates/*"]
# The cargo-fuzz harnesses are a separate workspace: they build only with a
# nightly toolchain in the fuzzing jobs and must not affect the crates' MSRV.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/Xila-Project/package_manager"
