name: Linux ARM64 build

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
      - ".github/workflows/linux-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native Linux aarch64 executable
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-enabled: "false"
      - name: "Build | Linux ARM64 package builder"
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu --package xila-package-builder
      - name: "Test | ARM64 release executable"
        run: target/aarch64-unknown-linux-gnu/release/xila-package --version
