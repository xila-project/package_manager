name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: Cargo workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: target
          cache-generation: v1-package-manager
      - name: "Validate | Cargo lockfile"
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: "Lint | Rust formatting"
        run: mise run format:check
      - name: "Validate | Cargo workspace"
        run: mise run check
      - name: "Lint | Cargo workspace"
        run: mise run clippy
      - name: "Test | Cargo workspace"
        run: mise run test
      - name: "Build | Rust documentation"
        run: mise run doc:check
      - name: "Report | Upload Rust documentation"
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          if-no-files-found: error

  manifest-schema:
    name: Validate package manifest JSON Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
      - name: "Setup | Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: "Setup | JSON Schema validator"
        run: python -m pip install jsonschema==4.25.1
      - name: "Validate | Package manifest samples"
        run: python -m unittest discover -s tests -p 'test_manifest_schema.py'
