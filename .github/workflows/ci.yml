name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    name: Cargo workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.2
      - uses: jdx/mr-boxington-action@v1
        with:
          toolchain: "1.99.0"
          github-cache-mode: target
          cache-generation: v1-package-manager
      - name: Verify committed dependency lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: mise run format:check
      - name: Check workspace
        run: mise run check
      - name: Lint workspace
        run: mise run clippy
      - name: Run tests
        run: mise run test
      - name: Build and check Rustdoc
        run: mise run doc:check
      - name: Upload generated Rust API documentation
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          if-no-files-found: error

  manifest-schema:
    name: Validate package manifest JSON Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Validate schema and sample manifests
        run: python -m unittest discover -s tests -p 'test_manifest_schema.py'
