name: Package Xila Wasm (reusable)

on:
  workflow_call:
    inputs:
      wasm-artifact:
        description: "Required name of the Actions artifact containing the compiled Wasm"
        required: true
        type: string
      wasm-path:
        description: "Optional Wasm file path inside the downloaded artifact (autodetect if exactly one)"
        required: false
        type: string
        default: ""
      manifest-path:
        description: "Relative path to the archive manifest JSON in the caller repository or manifest artifact"
        required: true
        type: string
      manifest-artifact:
        description: "Optional Actions artifact name containing a generated manifest"
        required: false
        type: string
        default: ""
      builder-ref:
        description: "Git ref or preferably immutable commit of the package_manager builder"
        required: false
        type: string
        default: "main"
      artifact-name:
        description: "Output Actions artifact name (must be unique when invoked multiple times)"
        required: false
        type: string
        default: "xila-package"
      upload-artifact:
        description: "Upload the .xpk package and checksum as workflow artifacts"
        required: false
        type: boolean
        default: true
      publish-release:
        description: "Attach the .xpk package and checksum to a tagged GitHub Release"
        required: false
        type: boolean
        default: false
      release-tag:
        description: "Existing Git tag to publish to; must point at the caller workflow commit"
        required: false
        type: string
        default: ""
    secrets:
      NETBIRD_SETUP_KEY:
        description: "Ephemeral NetBird setup key for the release signing peer"
        required: false
    outputs:
      filename:
        description: "Generated package filename"
        value: ${{ jobs.package.outputs.filename }}
      sha256:
        description: "SHA-256 of generated archive"
        value: ${{ !inputs.publish-release && jobs.package.outputs.sha256 || jobs.sign.outputs.sha256 }}
      artifact-name:
        description: "Name of the Actions artifact containing the package (when upload is enabled)"
        value: ${{ inputs.publish-release && format('{0}-signed', inputs.artifact-name) || jobs.package.outputs.artifact_name }}

jobs:
  package:
    name: Build and validate Xila package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_name: ${{ inputs.artifact-name }}
    steps:
      - name: "Setup | Checkout caller manifest"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: caller
      - name: "Setup | Checkout package builder"
        uses: actions/checkout@v7
        with:
          repository: Xila-Project/package_manager
          ref: ${{ inputs.builder-ref }}
          persist-credentials: false
          path: package-manager
      - name: "Setup | Fetch caller WASI artifact"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.wasm-artifact }}
          path: ${{ runner.temp }}/xila-wasm-input
      - name: "Setup | Fetch generated manifest"
        if: inputs.manifest-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.manifest-artifact }}
          path: ${{ runner.temp }}/xila-manifest-input
      - name: "Setup | Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: "Build | Host package builder"
        run: cargo build --locked --release --manifest-path package-manager/Cargo.toml -p xila-package-builder
      - name: "Package | Stage Wasm and validate archive"
        id: pack
        shell: bash
        env:
          INPUT_WASM_PATH: ${{ inputs.wasm-path }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
          INPUT_MANIFEST_ARTIFACT: ${{ inputs.manifest-artifact }}
        run: |
          set -euo pipefail
          manifest_root="$GITHUB_WORKSPACE/caller"
          if [[ -n "$INPUT_MANIFEST_ARTIFACT" ]]; then
            manifest_root="$RUNNER_TEMP/xila-manifest-input"
          fi
          python3 package-manager/tools/package_wasm.py \
            --wasm-root "$RUNNER_TEMP/xila-wasm-input" \
            --wasm-path "$INPUT_WASM_PATH" \
            --manifest-root "$manifest_root" \
            --manifest-path "$INPUT_MANIFEST_PATH" \
            --staging "$RUNNER_TEMP/xila-package-payload" \
            --manifest-output "$RUNNER_TEMP/xila-package-manifest.json" \
            --output "$RUNNER_TEMP/xila-package-dist" \
            --builder "$GITHUB_WORKSPACE/package-manager/target/release/xila-package" \
            --github-output "$GITHUB_OUTPUT"
      - name: "Prepare | Save verified package inputs for signing"
        if: inputs.publish-release
        shell: bash
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/xila-signing-input.tar" -C "$RUNNER_TEMP" xila-package-payload xila-package-manifest.json
      - name: "Report | Upload package signing inputs"
        if: inputs.publish-release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signing-input
          path: ${{ runner.temp }}/xila-signing-input.tar
          if-no-files-found: error
          retention-days: 1
      - name: "Report | Upload application package"
        if: inputs.upload-artifact && !inputs.publish-release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/xila-package-dist/*
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign and verify application package
    needs: package
    if: inputs.publish-release && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - name: "Validate | Signing builder revision"
        env:
          BUILDER_REF: ${{ inputs.builder-ref }}
          TRUSTED_BUILDER_REF: ${{ vars.XILA_SIGNING_BUILDER_SHA }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_BUILDER_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$BUILDER_REF" = "$TRUSTED_BUILDER_REF"
      - name: "Setup | Checkout tagged caller"
        uses: actions/checkout@v7
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: "Validate | Release commit belongs to main"
        working-directory: caller
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: "Setup | Checkout pinned package builder"
        uses: actions/checkout@v7
        with:
          repository: xila-project/package_manager
          ref: ${{ inputs.builder-ref }}
          path: package-manager
          persist-credentials: false
      - name: "Setup | Download package inputs"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signing-input
          path: ${{ runner.temp }}/xila-signing-download
      - name: "Setup | Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: "Build | Host package builder"
        run: cargo build --locked --release --manifest-path package-manager/Cargo.toml -p xila-package-builder
      - name: "Setup | Connect ephemeral NetBird peer"
        env:
          NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          NB_MANAGEMENT_URL: https://netbird.anneraud.fr
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NB_SETUP_KEY"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/netbird.tar.gz" https://github.com/netbirdio/netbird/releases/download/v0.82.0/netbird_0.82.0_linux_amd64.tar.gz
          echo 'b569f65de303d21317bc716f3116002e2cf175ae22a9f6d2bed91200a2f5000b  '"$RUNNER_TEMP/netbird.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/netbird.tar.gz" -C "$RUNNER_TEMP" netbird
          sudo install -m 0755 "$RUNNER_TEMP/netbird" /usr/local/bin/netbird
          sudo netbird service install
          sudo netbird service start
          sudo --preserve-env=NB_SETUP_KEY,NB_MANAGEMENT_URL netbird up
      - name: "Sign | Authenticate and verify package"
        id: sign
        shell: bash
        env:
          OPENBAO_ADDR: https://vault.xila.dev
          OPENBAO_JWT_MOUNT: jwt
          OPENBAO_JWT_ROLE: xila-app-release
          OPENBAO_TRANSIT_MOUNT: transit
          OPENBAO_TRANSIT_KEY: xila-applications
          OPENBAO_KEY_VERSION: ${{ vars.XILA_OPENBAO_KEY_VERSION }}
          PUBLIC_KEY_B64: ${{ vars.XILA_SIGNING_PUBLIC_KEY_B64 }}
          PACKAGE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          test -n "$OPENBAO_KEY_VERSION" && test -n "$PUBLIC_KEY_B64"
          mkdir -p "$RUNNER_TEMP/signing-work" "$RUNNER_TEMP/xila-signed-dist"
          python3 package-manager/tools/unpack_signing_input.py "$RUNNER_TEMP/xila-signing-download/xila-signing-input.tar" "$RUNNER_TEMP/signing-work"
          printf '%s' "$PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/signing-work/public.key"
          test "$(wc -c < "$RUNNER_TEMP/signing-work/public.key")" -eq 32
          builder="$GITHUB_WORKSPACE/package-manager/target/release/xila-package"
          "$builder" manifest signing-payload "$RUNNER_TEMP/signing-work/xila-package-manifest.json" "$RUNNER_TEMP/signing-work/signing-payload"
          python3 package-manager/tools/openbao_sign.py "$RUNNER_TEMP/signing-work/signing-payload" "$RUNNER_TEMP/signing-work/signature"
          "$builder" pack "$RUNNER_TEMP/signing-work/xila-package-payload" "$RUNNER_TEMP/signing-work/xila-package-manifest.json" "$RUNNER_TEMP/xila-signed-dist/$PACKAGE_FILENAME" "$RUNNER_TEMP/signing-work/signature"
          "$builder" verify "$RUNNER_TEMP/xila-signed-dist/$PACKAGE_FILENAME" "$RUNNER_TEMP/signing-work/public.key"
          cd "$RUNNER_TEMP/xila-signed-dist"
          sha256sum "$PACKAGE_FILENAME" > "$PACKAGE_FILENAME.sha256"
          printf 'sha256=%s\n' "$(sha256sum "$PACKAGE_FILENAME" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: "Report | Upload signed package"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signed
          path: ${{ runner.temp }}/xila-signed-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: "Cleanup | Disconnect NetBird"
        if: always()
        run: sudo netbird down || true

  publish-release:
    name: Attach Xila archive to GitHub Release
    needs: [package, sign]
    if: inputs.publish-release && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout caller release tag"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Setup | Download package archive"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signed
          path: ${{ runner.temp }}/xila-package-dist
      - name: "Validate | Release tag and commit"
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == -* ]]; then
            echo "::error::release-tag must name an existing git tag"
            exit 1
          fi
          git fetch --tags --force origin
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test -n "$tag_commit"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::release-tag does not reference this workflow commit"
            exit 1
          fi
      - name: "Publish | Package archive and checksum"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PACKAGE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/xila-package-dist/$PACKAGE_FILENAME" \
            "$RUNNER_TEMP/xila-package-dist/$PACKAGE_FILENAME.sha256" \
            --repo "$GITHUB_REPOSITORY"
