name: Package Xila Wasm (reusable)

on:
  workflow_call:
    inputs:
      wasm-artifact:
        description: "Required name of the Actions artifact containing the compiled Wasm"
        required: true
        type: string
      wasm-path:
        description: "Optional Wasm file path inside the downloaded artifact (autodetect if exactly one)"
        required: false
        type: string
        default: ""
      manifest-path:
        description: "Relative path to the archive manifest JSON in the caller repository or manifest artifact"
        required: true
        type: string
      shortcut-path:
        description: "Optional application-owned shortcut.json relative to caller repository (included in the signed bundle)"
        required: false
        type: string
        default: ""
      manifest-artifact:
        description: "Optional Actions artifact name containing a generated manifest"
        required: false
        type: string
        default: ""
      builder-ref:
        description: "Git ref or preferably immutable commit of the package_manager builder"
        required: false
        type: string
        default: "main"
      artifact-name:
        description: "Output Actions artifact name (must be unique when invoked multiple times)"
        required: false
        type: string
        default: "xila-package"
      upload-artifact:
        description: "Upload the .xpk package and checksum as workflow artifacts"
        required: false
        type: boolean
        default: true
      sign-artifact:
        description: "Sign main-branch artifacts with the XILA_DEV_SIGNING_SEED_B64 secret"
        required: false
        type: boolean
        default: false
      publish-release:
        description: "Sign with XILA_DEV_SIGNING_SEED_B64 and attach the .xpk, checksum and public key to a GitHub Release"
        required: false
        type: boolean
        default: false
      release-tag:
        description: "Existing Git tag to publish to; must point at the caller workflow commit"
        required: false
        type: string
        default: ""
    secrets:
      XILA_DEV_SIGNING_SEED_B64:
        description: "Base64-encoded raw 32-byte Ed25519 seed signing main-branch and release packages"
        required: false
    outputs:
      filename:
        description: "Generated package filename"
        value: ${{ jobs.package.outputs.filename }}
      sha256:
        description: "SHA-256 of generated archive"
        value: ${{ !(inputs.publish-release || inputs.sign-artifact) && jobs.package.outputs.sha256 || jobs.sign.outputs.sha256 }}
      artifact-name:
        description: "Name of the Actions artifact containing the package (when upload is enabled)"
        value: ${{ jobs.package.outputs.artifact_name }}

jobs:
  package:
    name: Build and validate Xila package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_name: ${{ inputs.artifact-name }}
    steps:
      - name: "Validate | Signing request context"
        env:
          SIGN_ARTIFACT: ${{ inputs.sign-artifact }}
          PUBLISH_RELEASE: ${{ inputs.publish-release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_ARTIFACT" == true && ( "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ) ]]; then
            echo "::error::sign-artifact requires a push to main"
            exit 1
          fi
          # release-plz tags releases from the main push itself (GITHUB_TOKEN
          # tags trigger no workflow), so both main and tag pushes may publish.
          if [[ "$PUBLISH_RELEASE" == true && ( "$GITHUB_EVENT_NAME" != push || ( "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/* ) ) ]]; then
            echo "::error::publish-release requires a push to main or a tag"
            exit 1
          fi
      - name: "Setup | Checkout caller manifest"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: caller
      - name: "Setup | Checkout package builder"
        uses: actions/checkout@v7
        with:
          repository: Xila-Project/package_manager
          ref: ${{ inputs.builder-ref }}
          persist-credentials: false
          path: package-manager
      - name: "Setup | Fetch caller WASI artifact"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.wasm-artifact }}
          path: ${{ runner.temp }}/xila-wasm-input
      - name: "Setup | Fetch generated manifest"
        if: inputs.manifest-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.manifest-artifact }}
          path: ${{ runner.temp }}/xila-manifest-input
      - name: "Setup | Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: "Build | Host package builder"
        run: cargo build --locked --release --manifest-path package-manager/Cargo.toml -p xila-package-builder
      - name: "Package | Stage Wasm and validate archive"
        id: pack
        shell: bash
        env:
          INPUT_WASM_PATH: ${{ inputs.wasm-path }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
          INPUT_SHORTCUT_PATH: ${{ inputs.shortcut-path }}
          INPUT_MANIFEST_ARTIFACT: ${{ inputs.manifest-artifact }}
        run: |
          set -euo pipefail
          manifest_root="$GITHUB_WORKSPACE/caller"
          if [[ -n "$INPUT_MANIFEST_ARTIFACT" ]]; then
            manifest_root="$RUNNER_TEMP/xila-manifest-input"
          fi
          python3 package-manager/tools/package_wasm.py \
            --wasm-root "$RUNNER_TEMP/xila-wasm-input" \
            --wasm-path "$INPUT_WASM_PATH" \
            --manifest-root "$manifest_root" \
            --manifest-path "$INPUT_MANIFEST_PATH" \
            --shortcut-path "$INPUT_SHORTCUT_PATH" \
            --staging "$RUNNER_TEMP/xila-package-payload" \
            --manifest-output "$RUNNER_TEMP/xila-package-manifest.json" \
            --output "$RUNNER_TEMP/xila-package-dist" \
            --builder "$GITHUB_WORKSPACE/package-manager/target/release/xila-package" \
            --github-output "$GITHUB_OUTPUT"
      - name: "Prepare | Save verified package inputs for signing"
        if: inputs.publish-release || inputs.sign-artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/xila-signing-input.tar" -C "$RUNNER_TEMP" xila-package-payload xila-package-manifest.json
      - name: "Report | Upload package signing inputs"
        if: inputs.publish-release || inputs.sign-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signing-input
          path: ${{ runner.temp }}/xila-signing-input.tar
          if-no-files-found: error
          retention-days: 1
      - name: "Report | Upload application package"
        if: inputs.upload-artifact && !inputs.publish-release && !inputs.sign-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/xila-package-dist/*
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign and verify application package
    needs: package
    if: github.event_name == 'push' && ((inputs.publish-release && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || (inputs.sign-artifact && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.sign.outputs.sha256 }}
    steps:
      - name: "Setup | Checkout caller"
        uses: actions/checkout@v7
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - name: "Validate | Signing commit belongs to main"
        working-directory: caller
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: "Setup | Checkout pinned package builder"
        uses: actions/checkout@v7
        with:
          repository: xila-project/package_manager
          ref: ${{ inputs.builder-ref }}
          path: package-manager
          persist-credentials: false
      - name: "Setup | Download package inputs"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-signing-input
          path: ${{ runner.temp }}/xila-signing-download
      - name: "Setup | Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: "Build | Host package builder"
        run: cargo build --locked --release --manifest-path package-manager/Cargo.toml -p xila-package-builder
      - name: "Prepare | Canonical manifest signing payload"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-work" "$RUNNER_TEMP/xila-signed-dist"
          python3 package-manager/tools/unpack_signing_input.py \
            "$RUNNER_TEMP/xila-signing-download/xila-signing-input.tar" \
            "$RUNNER_TEMP/signing-work"
          "$GITHUB_WORKSPACE/package-manager/target/release/xila-package" \
            manifest signing-payload \
            "$RUNNER_TEMP/signing-work/xila-package-manifest.json" \
            "$RUNNER_TEMP/signing-work/signing-payload"
      - name: "Sign | Development signing key"
        shell: bash
        env:
          XILA_DEV_SIGNING_SEED_B64: ${{ secrets.XILA_DEV_SIGNING_SEED_B64 }}
        run: |
          set -euo pipefail
          python3 package-manager/tools/sign_with_seed.py \
            "$RUNNER_TEMP/signing-work/signing-payload" \
            "$RUNNER_TEMP/signing-work/signature" \
            "$RUNNER_TEMP/signing-work/public.key"
      - name: "Package | Assemble and verify signed archive"
        id: sign
        shell: bash
        env:
          PACKAGE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          builder="$GITHUB_WORKSPACE/package-manager/target/release/xila-package"
          "$builder" pack \
            "$RUNNER_TEMP/signing-work/xila-package-payload" \
            "$RUNNER_TEMP/signing-work/xila-package-manifest.json" \
            "$RUNNER_TEMP/xila-signed-dist/$PACKAGE_FILENAME" \
            "$RUNNER_TEMP/signing-work/signature"
          "$builder" verify \
            "$RUNNER_TEMP/xila-signed-dist/$PACKAGE_FILENAME" \
            "$RUNNER_TEMP/signing-work/public.key"
          cd "$RUNNER_TEMP/xila-signed-dist"
          sha256sum "$PACKAGE_FILENAME" > "$PACKAGE_FILENAME.sha256"
          # Raw 32-byte public key, accepted by 'xila-package verify'. It is
          # not a trust anchor (see xila-project/packages); the seed is never published.
          cp "$RUNNER_TEMP/signing-work/public.key" "$PACKAGE_FILENAME.pub"
          printf 'sha256=%s\n' "$(sha256sum "$PACKAGE_FILENAME" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: "Report | Upload signed package"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/xila-signed-dist/*
          if-no-files-found: error
          retention-days: 14
  publish-release:
    name: Attach Xila archive to GitHub Release
    needs: [package, sign]
    if: inputs.publish-release && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: "Setup | Checkout caller release tag"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Setup | Download package archive"
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/xila-package-dist
      - name: "Validate | Release tag and commit"
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == -* ]]; then
            echo "::error::release-tag must name an existing git tag"
            exit 1
          fi
          git fetch --tags --force origin
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test -n "$tag_commit"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::release-tag does not reference this workflow commit"
            exit 1
          fi
      - name: "Publish | Package archive and checksum"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PACKAGE_FILENAME: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/xila-package-dist/$PACKAGE_FILENAME" \
            "$RUNNER_TEMP/xila-package-dist/$PACKAGE_FILENAME.sha256" \
            "$RUNNER_TEMP/xila-package-dist/$PACKAGE_FILENAME.pub" \
            --repo "$GITHUB_REPOSITORY"
