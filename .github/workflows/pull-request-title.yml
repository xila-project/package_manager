name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - name: "Validate | Conventional PR title"
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PULL_REQUEST_TITLE"]
          author = os.environ["PULL_REQUEST_AUTHOR"]

          # Conventional Commits, including an optional scope and a breaking-change marker.
          conventional = re.fullmatch(
              r"(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
              r"(?:\([a-z0-9][a-z0-9._/-]*\))?!?: \S[^\r\n]*",
              title,
          )

          # Dependabot's default generated pull-request titles are "Bump ...".
          # Only the verified bot account receives this exception.
          dependabot = author == "dependabot[bot]" and title.startswith("Bump ")

          if 0 < len(title) <= 120 and (conventional or dependabot):
              print("Pull request title is valid.")
              sys.exit(0)

          print("::error::Pull request title must follow Conventional Commits.")
          print("Examples: feat(reader): support TAR streams")
          print("          fix(builder): reject invalid files")
          print("          chore(deps): update dependencies")
          print("          feat!: introduce an incompatible package format")
          print("Dependabot's autogenerated 'Bump ...' titles are also accepted.")
          sys.exit(1)
          PY
