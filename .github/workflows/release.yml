name: Native binary release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version bump pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Open or update release pull request
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub release without crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Release Git tag and GitHub release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the native binary release
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[.[] | select(.package_name == "xila-package-builder") | .tag] | first // empty' <<< "$RELEASES")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build and upload ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - name: Build native executable
        run: cargo build --locked --release --target ${{ matrix.target }} --package xila-package-builder
      - name: Package and upload Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="xila-package-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" xila-package
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256"
      - name: Package and upload Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "xila-package-$env:TARGET.zip"
          Compress-Archive -Path 'target/$env:TARGET/release/xila-package.exe' -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          gh release upload "$env:RELEASE_TAG" "$archive" "$archive.sha256"
