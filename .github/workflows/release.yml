name: Native binary release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_initial_release:
        description: "One-time: publish xila-package-builder v0.1.0 without a release PR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version bump pull request
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || !inputs.bootstrap_initial_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Open or update release pull request
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub release without crates.io
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Select release-plz configuration
        id: release-config
        shell: bash
        env:
          BOOTSTRAP_INITIAL_RELEASE: ${{ inputs.bootstrap_initial_release }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$BOOTSTRAP_INITIAL_RELEASE" == "true" ]]; then
            # A normal release requires merging a release-plz PR. The initial
            # version is already 0.1.0, so release-plz has no bump PR to open.
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xila-package-builder") | .version')"
            if [[ "$version" != "0.1.0" ]]; then
              echo "::error::Bootstrap is only supported for xila-package-builder v0.1.0 (found $version)"
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/xila-package-builder-v0.1.0"; then
              echo "::error::The initial tag already exists; use the normal release workflow"
              exit 1
            fi
            if ! grep -qx 'release_always = false' release-plz.toml; then
              echo "::error::Expected release_always = false in the regular configuration"
              exit 1
            fi
            # Keep the checked-out repository and default policy unchanged.
            config="$RUNNER_TEMP/release-plz-bootstrap.toml"
            sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$config"
            echo "path=$config" >> "$GITHUB_OUTPUT"
            echo "Bootstrapping the initial git-only release with a temporary configuration."
          else
            echo "path=release-plz.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Release Git tag and GitHub release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ steps.release-config.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the native binary release
        id: tag
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(jq -r '[.[] | select(.package_name == "xila-package-builder") | .tag] | first // empty' <<< "$RELEASES")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build and upload ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}
      - name: Build native executable
        run: cargo build --locked --release --target ${{ matrix.target }} --package xila-package-builder
      - name: Package and upload Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="xila-package-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" xila-package
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256"
      - name: Package and upload Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "xila-package-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/xila-package.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          gh release upload "$env:RELEASE_TAG" "$archive" "$archive.sha256"
