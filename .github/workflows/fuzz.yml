name: Fuzz

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'mise.toml'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Weekly, Monday 06:00 UTC: the long runs.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz the package and registry parsers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # Pull requests run every target briefly; the weekly schedule runs long.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
      FUZZ_JOBS: '4'
      # Keep the libFuzzer build inside the cached target directory.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
    steps:
      - name: "Setup | Checkout sources"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Setup | Rust toolchain and build cache"
        uses: xila-project/workspace/.github/actions/setup-rust@c06ecdc0c3742c65bcfd2f5e7faa9cfcb59a5f6b
        with:
          cache-mode: target
          cache-generation: v1-package-manager-fuzz
      - name: "Setup | Nightly fuzzing toolchain and cargo-fuzz"
        run: mise run fuzz:setup
      - name: "Fuzz | Run every target"
        run: mise run fuzz:run
